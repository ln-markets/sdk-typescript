name: Base
description: Install node, pnpm via mise and setup cache

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      env:
        MISE_LOCKED: '1'
      with:
        version: 2026.5.5
        sha256: 3aaab5c05a8a94a93b42b4f581779bbd5c44ddb251e7f3639fc671ec5c6aab8a
        install_args: node pnpm

    - name: Expose pnpm config through "$GITHUB_OUTPUT"
      id: pnpm-config
      shell: bash
      run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

    - name: Setup pnpm cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-config.outputs.STORE_PATH }}
        key: ${{ runner.arch }}-pnpm-store-cache-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: ${{ runner.arch }}-pnpm-store-cache-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --prefer-offline
      shell: bash
