name: Setup mise
description: Install the repo's mise tools and put the repo bins on PATH, without installing dependencies

inputs:
  install_args:
    description: Tools to install, passed to `mise install`
    required: false
    default: node pnpm nub

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      env:
        MISE_LOCKED: '1'
      with:
        version: 2026.7.11
        sha256: e3cb3bf4795f494a0e9be3f69ee1464de9d12a991589f126035eebd973c17796
        install_args: ${{ inputs.install_args }}

    # mise-action >= 4.2.1 no longer exports mise.toml [env] _.path entries to later steps
    - name: Add repo bins to PATH
      shell: bash
      run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
