name: Check

concurrency:
  group: ${{ github.workflow }}.${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: ./.github/actions/setup-mise

      - name: Setup node
        uses: ./.github/actions/setup-node

      - name: Check formatting
        run: pnpm run format

      - name: Lint markdown
        run: pnpm run markdownlint

      - name: Spell check
        run: pnpm run spell-check

      - name: Lint code
        run: pnpm run lint

      - name: Type check code
        run: pnpm run type-check

      - name: Build code
        run: pnpm run build

      - name: Check unused dependencies
        run: pnpm run knip

      # Authenticated suites need API credentials and run locally
      # (`pnpm test` with a .env); CI covers unit and public-endpoint tests.
      - name: Test
        run: pnpm run test

  security:
    uses: ./.github/workflows/security.yml
