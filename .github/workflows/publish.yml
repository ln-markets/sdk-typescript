name: Publish & Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - src/**
      - .github/workflows/publish.yml

jobs:
  check:
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  publish:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: write
      id-token: write # npm provenance / trusted publishing
    outputs:
      type: ${{ steps.publish.outputs.type }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      # Tag push below needs the persisted credential.
      - name: Checkout code # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: ./.github/actions/setup-mise

      - name: Setup node
        uses: ./.github/actions/setup-node

      - name: Build
        run: pnpm run build

      - id: publish
        name: Publish to npm
        uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        with:
          provenance: true

      - name: Create release tag
        if: ${{ steps.publish.outputs.type }}
        run: |
          git tag "v${{ steps.publish.outputs.version }}"
          git push origin "v${{ steps.publish.outputs.version }}"

  release-notes:
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ needs.publish.outputs.type }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create GitHub release
        run: gh release create "v${{ needs.publish.outputs.version }}" --title "v${{ needs.publish.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
